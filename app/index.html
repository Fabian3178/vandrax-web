<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vandrax – Krafttraining planen und protokollieren</title>
<meta name="description" content="Vandrax ist die App zum Planen und Protokollieren von Krafttraining: Trainingspläne, Live-Workouts, Historie und Statistiken.">
<style>
  :root { color-scheme: dark; --bg:#0c0d0b; --card:#161815; --text:#e9ece6; --muted:#9aa093; --accent:#c6ff3d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:820px; margin:0 auto; padding:24px 16px 48px; }
  .top { display:flex; justify-content:flex-end; }
  .top button { background:none; border:1px solid var(--muted); color:var(--text); border-radius:8px; padding:4px 10px; cursor:pointer; }
  .hero { text-align:center; padding:32px 0 16px; }
  .logo { width:112px; height:112px; border-radius:26px; box-shadow:0 0 48px rgba(101,255,12,.25); }
  h1 { font-size:2.4rem; margin:.5em 0 .1em; letter-spacing:.02em; }
  .tagline { color:var(--muted); font-size:1.1rem; margin:0 auto; max-width:520px; }
  .badge { display:inline-block; margin-top:18px; padding:6px 14px; border-radius:999px; background:var(--card); border:1px solid #2a2d27; color:var(--accent); font-size:.9rem; }
  h2 { font-size:1.2rem; color:var(--accent); margin:2em 0 .6em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:12px; }
  .card { background:var(--card); border-radius:14px; padding:14px 18px; }
  .card strong { display:block; margin-bottom:2px; }
  .card span { color:var(--muted); font-size:.95rem; }
  footer { margin-top:40px; padding-top:18px; border-top:1px solid #23261f; color:var(--muted); font-size:.92rem; text-align:center; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
<div class="top"><button id="switch" type="button">EN</button></div>

<section class="hero">
<svg class="logo" viewBox="0 0 1024 1024" role="img" aria-label="Vandrax">
<defs>
 <radialGradient id="bg" cx="48%" cy="40%" r="75%"><stop stop-color="#191b18"/><stop offset="1" stop-color="#090a09"/></radialGradient>
 <linearGradient id="main" gradientUnits="userSpaceOnUse" x1="345" y1="335" x2="543" y2="715"><stop stop-color="#d5ff66"/><stop offset=".28" stop-color="#92ff20"/><stop offset=".62" stop-color="#42fa05"/><stop offset=".83" stop-color="#23da00"/><stop offset="1" stop-color="#9aff00"/></linearGradient>
 <linearGradient id="right" gradientUnits="userSpaceOnUse" x1="685" y1="260" x2="689" y2="614"><stop stop-color="#d5ff62"/><stop offset=".32" stop-color="#96ff21"/><stop offset=".7" stop-color="#36ee00"/><stop offset=".89" stop-color="#13bd00"/><stop offset="1" stop-color="#a4ff06"/></linearGradient>
 <linearGradient id="triangle" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#caff56"/><stop offset="1" stop-color="#65fa08"/></linearGradient>
 <filter id="halo" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="12"/></filter>
 <path id="v" d="M249 332 L376 370 L485 630 L546 430 L625 360 L545 670 L483 739 Z"/>
 <path id="bar" d="M661 318 L779 232 L685 562 L576 638 Z"/>
 <path id="center" d="M440 431 L511 451 L482 541 Z"/>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<g transform="translate(512 512) scale(1.32) translate(-512 -512)">
<g fill="#65ff0c" opacity=".19" filter="url(#halo)"><use href="#v"/><use href="#bar"/><use href="#center"/></g>
<use href="#v" fill="url(#main)"/>
<use href="#bar" fill="url(#right)"/>
<use href="#center" fill="url(#triangle)"/>
</g>
</svg>
<h1>Vandrax</h1>
<p class="tagline" id="tagline"></p>
<span class="badge" id="badge"></span>
</section>

<h2 id="h-features"></h2>
<div class="grid" id="features"></div>

<h2 id="h-about"></h2>
<p id="about"></p>

<footer>
<a id="privacy" href="../privacy/"></a> ·
<span id="contact"></span> <a href="mailto:fabr.publish@gmail.com">fabr.publish@gmail.com</a>
</footer>
</main>

<script>
  var T = {
    de: {
      title: 'Vandrax – Krafttraining planen und protokollieren',
      tagline: 'Plane dein Training, protokolliere jeden Satz und sieh, wie du stärker wirst.',
      badge: 'Für Android – bald bei Google Play',
      hFeatures: 'Was Vandrax kann',
      features: [
        ['Trainingspläne', 'Eigene Pläne mit Trainingstagen anlegen oder aus 13 Vorlagen (Standard-Splits, PHAT, Arnold …) starten.'],
        ['Großer Übungskatalog', 'Über 1.300 Übungen mit Animationen, Anleitungen und Filtern nach Körperregion und Equipment.'],
        ['Live-Workout', 'Gewicht, Wiederholungen und RIR pro Satz erfassen, mit Werten vom letzten Mal vorbefüllt.'],
        ['Pausentimer', 'Countdown auch bei ausgeschaltetem Bildschirm, mit Signalton, wenn die Pause vorbei ist.'],
        ['Historie & Kalender', 'Alle Trainings im Kalender, dazu Wochen-Serie und Details zu jeder Einheit.'],
        ['Statistiken', 'Trainingsvolumen, Muskelgruppen, Fortschritt, Bestleistungen und Intensität (RIR) im Überblick.']
      ],
      hAbout: 'Über die App',
      about: 'Vandrax ist zweisprachig (Deutsch und Englisch), im dunklen Design gehalten und kommt ohne Werbung und ohne Tracking aus. Deine Daten gehören dir und lassen sich jederzeit in der App löschen.',
      privacy: 'Datenschutz',
      contact: 'Kontakt:'
    },
    en: {
      title: 'Vandrax – plan and log your strength training',
      tagline: 'Plan your training, log every set and watch yourself get stronger.',
      badge: 'For Android – coming soon to Google Play',
      hFeatures: 'What Vandrax does',
      features: [
        ['Training plans', 'Build your own plans with training days, or start from 13 templates (standard splits, PHAT, Arnold …).'],
        ['Large exercise catalog', 'Over 1,300 exercises with animations, instructions and filters by body region and equipment.'],
        ['Live workout', 'Log weight, reps and RIR for every set, prefilled with your values from last time.'],
        ['Rest timer', 'A countdown that keeps running with the screen off, with a sound when your rest is over.'],
        ['History & calendar', 'All workouts in a calendar, plus your weekly streak and details for every session.'],
        ['Statistics', 'Training volume, muscle groups, progress, personal records and intensity (RIR) at a glance.']
      ],
      hAbout: 'About the app',
      about: 'Vandrax is bilingual (German and English), uses a dark design and comes without ads or tracking. Your data belongs to you and can be deleted in the app at any time.',
      privacy: 'Privacy policy',
      contact: 'Contact:'
    }
  };
  var btn = document.getElementById('switch');
  var current;
  function show(lang) {
    current = lang;
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    document.getElementById('tagline').textContent = t.tagline;
    document.getElementById('badge').textContent = t.badge;
    document.getElementById('h-features').textContent = t.hFeatures;
    document.getElementById('h-about').textContent = t.hAbout;
    document.getElementById('about').textContent = t.about;
    document.getElementById('privacy').textContent = t.privacy;
    document.getElementById('contact').textContent = t.contact;
    var box = document.getElementById('features');
    box.textContent = '';
    t.features.forEach(function (f) {
      var c = document.createElement('div'); c.className = 'card';
      var s = document.createElement('strong'); s.textContent = f[0];
      var p = document.createElement('span'); p.textContent = f[1];
      c.appendChild(s); c.appendChild(p); box.appendChild(c);
    });
    btn.textContent = lang === 'de' ? 'EN' : 'DE';
  }
  btn.addEventListener('click', function () { show(current === 'de' ? 'en' : 'de'); });
  show((navigator.language || 'en').toLowerCase().indexOf('de') === 0 ? 'de' : 'en');
</script>
</body>
</html>
