<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Mail bestätigt · Fitness App</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230B0D0F'/%3E%3Cpath d='M18 7 10 16l-4-4' stroke='%23C6FF3D' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #0B0D0F;
    color: #F5F7F5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter,
      system-ui, sans-serif;
    line-height: 1.5;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #15181C;
    border: 1px solid #23272C;
    border-radius: 20px;
    padding: 40px 28px;
    text-align: center;
  }
  .badge {
    width: 72px;
    height: 72px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }
  .badge svg { width: 38px; height: 38px; }
  .ok .badge { background: rgba(198, 255, 61, 0.12); }
  .ok .badge svg { stroke: #C6FF3D; }
  .err .badge { background: rgba(255, 92, 92, 0.12); }
  .err .badge svg { stroke: #FF5C5C; }
  h1 { font-size: 1.4rem; margin-bottom: 10px; letter-spacing: -0.01em; }
  p { color: #8B9198; font-size: 0.95rem; }
</style>
</head>
<body>
  <main class="card ok" id="card">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path id="icon" d="M20 6 9 17l-5-5"></path>
      </svg>
    </div>
    <h1 id="title"></h1>
    <p id="text"></p>
  </main>
<script>
  // Supabase hängt bei fehlgeschlagener Verifikation (z. B. abgelaufener
  // Link) error-Parameter an die Redirect-URL - je nach Auth-Flow im Hash
  // oder im Query-String. Bei Erfolg stehen dort Tokens bzw. ein code, die
  // hier bewusst ignoriert werden: die eigentliche Bestätigung ist zu
  // diesem Zeitpunkt schon serverseitig passiert, der Nutzer meldet sich
  // danach ganz normal per Passwort in der App an.
  var raw = location.hash.slice(1) || location.search.slice(1);
  var params = new URLSearchParams(raw);
  var hasError =
    params.has('error') ||
    params.has('error_code') ||
    params.has('error_description');

  var de = (navigator.language || 'en').toLowerCase().indexOf('de') === 0;
  var copy = {
    ok: {
      de: [
        'E-Mail bestätigt',
        'Deine E-Mail-Adresse ist bestätigt. Schließe dieses Fenster und melde dich in der App an.'
      ],
      en: [
        'Email confirmed',
        'Your email address is confirmed. Close this window and sign in to the app.'
      ]
    },
    err: {
      de: [
        'Link ungültig oder abgelaufen',
        'Öffne die App und registriere dich erneut, um eine neue Bestätigungsmail zu erhalten.'
      ],
      en: [
        'Link invalid or expired',
        'Open the app and register again to receive a new confirmation email.'
      ]
    }
  };

  var state = hasError ? 'err' : 'ok';
  var t = copy[state][de ? 'de' : 'en'];
  document.getElementById('card').className = 'card ' + state;
  document.getElementById('title').textContent = t[0];
  document.getElementById('text').textContent = t[1];
  document.title = t[0] + ' · Fitness App';
  if (hasError) {
    document.getElementById('icon').setAttribute('d', 'M18 6 6 18M6 6l12 12');
  }
</script>
</body>
</html>
